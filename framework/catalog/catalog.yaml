suiteMapping:
  smoke: [ESS-REC-REG-S001-TC001, ESS-PHY-QUEUE-S001-TC001]
  functional: [ESS-REC-REG-S001-TC001, ESS-REC-REG-S002-TC001]
  regression:
    [
      ESS-REC-REG-S001-TC001,
      ESS-REC-REG-S002-TC001,
      ESS-PHY-QUEUE-S001-TC001,
      ESS-LIC-SEAT-S001-TC001,
    ]
