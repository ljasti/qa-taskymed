# File: framework/catalog/catalog.yaml
# Purpose: Single source of truth for Essential workflows, scenarios, test cases and suite membership.
# Maintainer: Lakshmikiran J. | Project: TaskyMed QA
# Origin: Manually maintained; parsed by scripts/verify.ts catalog.
# Usage: npm run catalog:validate. Edit manually when approved coverage changes.
# IDs are stable; automated means code exists, not that it passed. validate-catalog.ts checks references.
# Field guide: id=stable identifier, workflowId/scenarioId=parent, status=state, tags/suites=selection.
product: TaskyMed Health OS
plan: Essential
workflows:
  - id: ESS-REC-REG
    name: Patient Registration
    workspace: reception
    entitlement: clinical_core
    authorizedRoles: [reception]
    risk: high
    priority: P0
    applicableEnvironments: [local, dev, qa, poc, uat]
    status: discovered
  - id: ESS-PHY-QUEUE
    name: Physician Queue
    workspace: physician
    entitlement: clinical_core
    authorizedRoles: [physician]
    risk: high
    priority: P0
    applicableEnvironments: [local, dev, qa, poc, uat]
    status: discovered
  - id: ESS-LIC-SEAT
    name: User Seat Allocation
    workspace: licensing
    entitlement: license
    authorizedRoles: [customer_admin]
    risk: critical
    priority: P0
    applicableEnvironments: [local, dev, qa]
    status: blocked-essential-fixture
scenarios:
  - id: ESS-REC-REG-S001
    workflowId: ESS-REC-REG
    description: Valid synthetic registration accepts required fields
    classification: positive
    risk: high
    suites: [smoke, functional, regression]
