    workflowId: ESS-REC-REG
    description: Registration validates missing required fields
    classification: negative
    risk: high
    suites: [functional, regression]
  - id: ESS-PHY-QUEUE-S001
    workflowId: ESS-PHY-QUEUE
    description: Authorized physician can view the queue
    classification: positive
    risk: high
    suites: [smoke, e2e, regression]
  - id: ESS-LIC-SEAT-S001
    workflowId: ESS-LIC-SEAT
    description: Essential seat ceiling is enforced
    classification: boundary
    risk: critical
    suites: [licensing, security, regression]
testCases:
  - id: ESS-REC-REG-S001-TC001
    scenarioId: ESS-REC-REG-S001
    automatedFile: tests/reception/registration-positive.spec.ts
    environments: [local, dev, qa]
    status: automated
  - id: ESS-REC-REG-S002-TC001
    scenarioId: ESS-REC-REG-S002
    automatedFile: tests/reception/registration-validation.spec.ts
    environments: [local, dev, qa, poc, uat]
    status: automated
  - id: ESS-PHY-QUEUE-S001-TC001
    scenarioId: ESS-PHY-QUEUE-S001
    automatedFile: tests/physician/queue-visibility.spec.ts
    environments: [local, dev, qa, poc, uat]
